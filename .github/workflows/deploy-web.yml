# Publishes the web app to GitHub Pages every time the `web/` folder changes on
# the main branch. Nothing to run by hand — push, and a minute later the live
# site has your change.
name: Deploy web app

on:
  push:
    # The branch this project actually lives on, plus main in case the branches
    # are tidied up later. Deploying from whichever one is pushed avoids a merge.
    branches:
      - 2StableVersion2925-08-12
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  # Also lets you trigger a deploy manually from the Actions tab.
  workflow_dispatch:

# Permissions this job needs in order to publish a Pages site.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer deploy win rather than queueing both.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Everything happens inside the web folder; the Swift app is untouched.
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` installs the exact versions recorded in package-lock.json,
      # so the published build matches what was tested locally.
      - name: Install dependencies
        run: npm ci

      - name: Check for type errors
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
